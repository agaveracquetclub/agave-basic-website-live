services:
  - type: web
    name: agave-racquet-club
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn agave_site.wsgi:application
    healthCheckPath: /
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_ALLOWED_HOSTS
        sync: false
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: DB_SSL_REQUIRE
        value: "True"
      - key: MERCADOPAGO_ACCESS_TOKEN
        sync: false
      - key: MERCADOPAGO_PUBLIC_KEY
        sync: false
      - key: MERCADOPAGO_WEBHOOK_SECRET
        sync: false
      - key: ENVIA_API_TOKEN
        sync: false
      - key: ENVIA_RATE_URL
        value: https://api.envia.com/ship/rate/
      - key: ENVIA_SHIPMENT_URL
        value: https://api.envia.com/ship/generate/
      - key: SUPABASE_S3_ENDPOINT
        sync: false
      - key: SUPABASE_S3_ACCESS_KEY
        sync: false
      - key: SUPABASE_S3_SECRET_KEY
        sync: false
      - key: SUPABASE_S3_BUCKET
        value: agave-products
      - key: SUPABASE_S3_REGION
        value: us-east-1
      - key: SUPABASE_STORAGE_PUBLIC_DOMAIN
        sync: false
      - key: AGAVE_CONTACT_EMAIL
        value: agaveracquetclub@gmail.com
      - key: AGAVE_WHATSAPP_URL
        sync: false
      - key: AGAVE_FACEBOOK_URL
        sync: false
      - key: AGAVE_INSTAGRAM_URL
        sync: false
      - key: AGAVE_GOOGLE_BUSINESS_URL
        sync: false
