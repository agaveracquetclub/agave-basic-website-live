{% extends 'store/base.html' %}
{% block title %}Ingresar | Agave{% endblock %}
{% block content %}<section class="section container form-page"><div class="panel"><span class="eyebrow">Bienvenido</span><h1>Ingresa a tu cuenta</h1><form method="post" class="form-stack">{% csrf_token %}{{ form.as_p }}{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}<button class="button primary">Ingresar</button></form><p>¿Todavía no tienes cuenta? <a href="{% url 'store:register' %}">Regístrate</a>.</p></div></section>{% endblock %}
