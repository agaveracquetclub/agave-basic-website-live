<article class="product-card">
  <a class="product-image" href="{{ product.get_absolute_url }}">
    {% if product.primary_image_url %}<img src="{{ product.primary_image_url }}" alt="{{ product.name }}" loading="lazy" data-card-image>{% else %}<span>AGAVE</span>{% endif %}
  </a>
  <div class="product-card-body">
    <p class="product-meta">{{ product.category }} · {{ product.brand }}</p>
    <h3><a href="{{ product.get_absolute_url }}">{{ product.name }}</a></h3>
    {% if product.price_from %}<p class="price">Desde ${{ product.price_from|floatformat:2 }} MXN</p>{% endif %}
  </div>
</article>
